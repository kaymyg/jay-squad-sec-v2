name: Android foundation

on:
  push:
    branches:
      - "stage-2/**"
    paths:
      - "android/**"
      - "bridge/**"
      - "core/**"
      - "protocol/**"
      - "update/**"
      - "apply/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "bridge/**"
      - "core/**"
      - "protocol/**"
      - "update/**"
      - "apply/**"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-removed "tools"
          # package, which fails on current runner images. Install exactly
          # what compileSdk 35 needs.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Install Rust (MSRV) with Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build native engine for Android
        # No builder key here: signed updates stay fail-closed in CI builds.
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash android/build-native.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Verify the APK carries the engine for every ABI, 16 KB aligned
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          readelf="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libjay_squad_sec_bridge.so" || { echo "missing $abi"; exit 1; }
            so=android/app/src/main/jniLibs/$abi/libjay_squad_sec_bridge.so
            "$readelf" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | grep -qx 0x4000 \
              || { echo "$abi not 16 KB aligned"; "$readelf" -lW "$so" | grep LOAD; exit 1; }
            "$readelf" -sW --dyn-syms "$so" | grep -q Java_com_jaysquadsec_bridge_NativeBridge_nativeNew \
              || { echo "$abi missing JNI symbols"; exit 1; }
            echo "$abi ok: $(stat -c %s "$so") bytes"
          done
      - name: Upload debug APK
        # Debug-signed, for installing on a test phone only; not a release.
        uses: actions/upload-artifact@v4
        with:
          name: jay-squad-sec-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
