name: Android foundation

on:
  push:
    branches:
      - "stage-2/**"
    paths:
      - "android/**"
      - "bridge/jvm/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "bridge/jvm/**"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-removed "tools"
          # package, which fails on current runner images. Install exactly
          # what compileSdk 35 needs.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Upload debug APK
        # Debug-signed, for installing on a test phone only; not a release.
        uses: actions/upload-artifact@v4
        with:
          name: jay-squad-sec-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
