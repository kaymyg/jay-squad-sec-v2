[package]
name = "jay-squad-sec-update"
version = "0.1.0"
edition = "2021"
description = "Signed-patch verification: the product accepts a patch only if it carries a valid ed25519 signature from the builder's key"

# The ONE third-party dependency in the whole product, and only for the thing
# that genuinely needs real asymmetric crypto: proving a patch came from the
# builder and nobody else. ed25519-compact is pure Rust, ~no transitive deps,
# by the author of libsodium — minimal supply-chain surface, which is the
# point. Pinned to an exact version; verify Cargo.lock before every release.
[lib]
name = "jay_squad_sec_update"
path = "src/lib.rs"

[features]
# Product-safe default: verify-only. No signing code, no RNG, so no build of
# the shipped product (agent, apply, bridge) can accidentally include them.
# Signing is enabled explicitly by the offline builder tool (tools/signer) and
# by test builds via the self dev-dependency below.
default = []
signing = ["ed25519-compact/random"]

[dependencies]
ed25519-compact = { version = "=2.1.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Enables `signing` for this crate's own tests only (resolver 2 keeps dev-dep
# features out of normal builds).
jay-squad-sec-update = { path = ".", features = ["signing"] }
